<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-[#0b0f17] text-white min-h-screen flex flex-col items-center justify-center p-6">

  <div class="max-w-md w-full bg-[#131b2e] border border-slate-800 rounded-2xl p-8 flex flex-col items-center text-center shadow-xl">
    <!-- Avatar -->
    <img id="avatar" class="w-28 h-28 rounded-full border-2 border-cyan-400 mb-4 object-cover" src="" alt="Avatar" />
    
    <!-- Badges & Information -->
    <span id="badge" class="px-3 py-1 bg-cyan-950/60 border border-cyan-500/40 text-cyan-400 text-xs rounded-full font-semibold mb-2"></span>
    <h1 id="name" class="text-2xl font-bold"></h1>
    <p id="role" class="text-slate-400 text-sm mb-4"></p>
    <p id="bio" class="text-slate-300 text-sm leading-relaxed mb-6"></p>

    <!-- Social Links -->
    <div id="socials" class="flex gap-4 mb-8 text-sm">
      <a id="lnk-linkedin" class="text-cyan-400 hover:underline" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a id="lnk-github" class="text-cyan-400 hover:underline" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a id="lnk-email" class="text-cyan-400 hover:underline">Email</a>
    </div>

    <!-- Personal QR Code Box -->
    <div class="w-full bg-[#0b0f17] border border-slate-800 rounded-xl p-4 flex flex-col items-center">
      <p class="text-xs text-slate-400 mb-3 uppercase tracking-wider font-semibold">Scan to View My Profile</p>
      <div id="qrcode" class="p-2 bg-white rounded-lg"></div>
    </div>

    <a href="index.html" class="mt-6 text-xs text-slate-500 hover:text-slate-300">← Back to All Members</a>
  </div>

  <!-- Load data and generate dynamic portfolio -->
  <script src="members.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id") || "1";
    const data = members[id] || members["1"];

    document.getElementById("name").textContent = data.name;
    document.getElementById("role").textContent = data.role;
    document.getElementById("badge").textContent = `${data.department} • #${String(id).padStart(2, '0')}`;
    document.getElementById("bio").textContent = data.bio;
    document.getElementById("avatar").src = data.avatar;

    document.getElementById("lnk-linkedin").href = data.linkedin;
    document.getElementById("lnk-github").href = data.github;
    document.getElementById("lnk-email").href = `mailto:${data.email}`;

    // Generates unique QR linking directly to this profile URL
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 140,
      height: 140
    });
  </script>
</body>
</html>
