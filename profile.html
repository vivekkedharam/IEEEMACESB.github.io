<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- HTML to Image Converter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.25), 0 0 45px rgba(249, 115, 22, 0.18);
      }
      50% {
        box-shadow: 0 0 32px rgba(239, 68, 68, 0.45), 0 0 65px rgba(249, 115, 22, 0.35);
      }
    }

    .animate-card {
      animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .avatar-ring {
      background: linear-gradient(135deg, #ef4444, #f97316, #fb923c);
      padding: 3px;
    }
  </style>
</head>
<body class="bg-[#050507] text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden selection:bg-orange-500 selection:text-black">

  <!-- Background Glows -->
  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-red-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-orange-600/5 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Profile Card Container -->
  <div id="card-to-capture" class="animate-card pulse-glow relative max-w-md w-full bg-[#0d0c11] border border-neutral-800 rounded-2xl p-8 flex flex-col items-center text-center shadow-2xl">

    <!-- Avatar with Red-Orange Ring -->
    <div class="relative mb-5 group">
      <div class="avatar-ring rounded-full shadow-lg">
        <img id="avatar" class="w-28 h-28 rounded-full bg-[#050507] object-cover" src="" alt="Avatar" crossOrigin="anonymous" />
      </div>
    </div>
    
    <!-- Name and Role -->
    <h1 id="name" class="text-2xl font-extrabold tracking-tight text-white mb-1"></h1>
    <p id="role" class="text-orange-400/90 text-sm font-medium mb-3"></p>
    <p id="bio" class="text-neutral-300 text-sm leading-relaxed mb-6 font-normal"></p>

    <!-- Social Links -->
    <div id="socials" class="flex flex-wrap justify-center gap-3 mb-8 text-sm font-medium">
      <a id="lnk-whatsapp" class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500 hover:text-black transition-all" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="lnk-linkedin" class="px-3 py-1.5 rounded-lg bg-orange-500/10 text-orange-400 border border-orange-500/30 hover:bg-orange-500 hover:text-black transition-all" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a id="lnk-github" class="px-3 py-1.5 rounded-lg bg-neutral-900 text-neutral-300 border border-neutral-800 hover:bg-neutral-800 hover:text-white transition-all" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a id="lnk-email" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white transition-all">Email</a>
    </div>

    <!-- Personal QR Code Box -->
    <div class="w-full bg-[#050507] border border-neutral-800 rounded-xl p-5 flex flex-col items-center">
      <p class="text-[11px] text-neutral-400 mb-3 uppercase tracking-widest font-bold">Scan to View My Profile</p>
      <div id="qrcode" class="p-2.5 bg-white rounded-xl shadow-md"></div>
    </div>
  </div>

  <!-- Action Controls -->
  <div class="flex flex-col items-center gap-3 mt-6 z-10">
    <button onclick="downloadImage()" class="px-5 py-2.5 bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-black font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg transition-transform active:scale-95 flex items-center gap-2 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Download Card as Image
    </button>
    <a href="index.html" class="text-xs text-neutral-500 hover:text-orange-400 transition-colors">← Back to All Members</a>
  </div>

  <!-- Dynamic Script -->
  <script src="members.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id") || "01";
    const data = members[id] || members["01"];

    document.getElementById("name").textContent = data.name;
    document.getElementById("role").textContent = data.role;
    document.getElementById("bio").textContent = data.bio;
    document.getElementById("avatar").src = data.avatar;

    document.getElementById("lnk-whatsapp").href = data.whatsapp;
    document.getElementById("lnk-linkedin").href = data.linkedin;
    document.getElementById("lnk-github").href = data.github;
    document.getElementById("lnk-email").href = `mailto:${data.email}`;

    // Generates unique QR
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 135,
      height: 135
    });

    // Capture & Download function
    function downloadImage() {
      const card = document.getElementById("card-to-capture");
      html2canvas(card, {
        backgroundColor: "#050507",
        scale: 2,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `${data.name.replace(/\\s+/g, '_')}_Portfolio.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>
