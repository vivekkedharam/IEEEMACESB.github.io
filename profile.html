<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Member Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    #qrcode img { margin: 0 auto; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center py-8 px-4 sm:px-6 relative overflow-x-hidden selection:bg-orange-500 selection:text-black bg-cover bg-center bg-no-repeat bg-scroll sm:bg-fixed" style="background-image: linear-gradient(rgba(5, 5, 7, 0.78), rgba(5, 5, 7, 0.78)), url('BG.jpeg');">

  <!-- Glow effect -->
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] sm:w-[500px] sm:h-[500px] bg-gradient-to-tr from-amber-600/20 to-red-600/20 blur-[90px] sm:blur-[120px] rounded-full pointer-events-none -z-10"></div>

  <!-- Profile Card -->
  <div id="profile-card" class="w-full max-w-[360px] sm:max-w-md bg-[#0a0a0c]/90 backdrop-blur-xl border border-white/10 rounded-2xl p-6 sm:p-8 flex flex-col items-center shadow-[0_0_50px_rgba(0,0,0,0.8)] relative">
    
    <!-- Avatar -->
    <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full p-1 bg-gradient-to-tr from-amber-500 to-red-500 shadow-[0_0_25px_rgba(249,115,22,0.4)]">
      <img id="avatar" alt="Avatar" class="w-full h-full object-cover rounded-full" crossorigin="anonymous">
    </div>

    <!-- Member Info -->
    <h1 id="name" class="text-xl sm:text-2xl font-bold tracking-wide mt-4 text-center"></h1>
    <p id="role" class="text-xs sm:text-sm font-medium text-orange-400 mt-0.5 text-center"></p>
    <p id="department" class="text-[11px] sm:text-xs text-gray-400 text-center tracking-wider mt-0.5"></p>

    <!-- Social Action Buttons -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-5 w-full">
      <a id="lnk-whatsapp" target="_blank" rel="noopener noreferrer" class="py-2 text-center text-xs font-semibold rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition-all">WhatsApp</a>
      <a id="lnk-linkedin" target="_blank" rel="noopener noreferrer" class="py-2 text-center text-xs font-semibold rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 transition-all">LinkedIn</a>
      <a id="lnk-github" target="_blank" rel="noopener noreferrer" class="py-2 text-center text-xs font-semibold rounded-lg bg-neutral-500/10 text-neutral-300 border border-neutral-500/20 hover:bg-neutral-500/20 transition-all">GitHub</a>
      <a id="lnk-email" target="_blank" rel="noopener noreferrer" class="py-2 text-center text-xs font-semibold rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 transition-all">Email</a>
    </div>

    <!-- QR Section -->
    <div class="mt-6 p-4 rounded-xl bg-black/40 border border-white/5 flex flex-col items-center w-full">
      <p class="text-[10px] tracking-widest text-gray-400 uppercase font-semibold mb-3">Scan to View My Profile</p>
      <div id="qrcode" class="p-2 bg-white rounded-lg shadow-inner flex items-center justify-center min-h-[144px] min-w-[144px]"></div>
    </div>
  </div>

  <!-- Action Controls -->
  <div class="mt-5 flex flex-col items-center gap-3 w-full max-w-[360px] sm:max-w-md">
    <button id="download-btn" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-black font-semibold text-xs tracking-wider uppercase shadow-lg shadow-orange-500/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      Download Card as Image
    </button>
    <a href="https://edu.ieee.org/in-mace/" target="_blank" rel="noopener noreferrer" class="text-xs text-orange-400 hover:text-orange-300 transition-colors"> IEEE MACESB </a>
  </div>

  <script src="members.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const memberId = urlParams.get("id") || "01";
    const data = members[memberId] || members["01"];

    document.getElementById("name").innerText = data.name;
    document.getElementById("role").innerText = data.role;
    document.getElementById("department").innerText = data.department;
    document.getElementById("avatar").src = data.avatar;

    document.getElementById("lnk-whatsapp").href = data.whatsapp;
    document.getElementById("lnk-linkedin").href = data.linkedin;
    document.getElementById("lnk-github").href = data.github;

    const emailClean = data.email.replace('mailto:', '');
    document.getElementById("lnk-email").href = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(emailClean)}`;

    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 128,
      height: 128,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById("download-btn").addEventListener("click", () => {
      const card = document.getElementById("profile-card");
      html2canvas(card, {
        scale: 2,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `${data.name.replace(/\s+/g, '_')}_Profile.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });
  </script>
</body>
</html>
