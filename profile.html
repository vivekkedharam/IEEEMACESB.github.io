<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.25), 0 0 45px rgba(249, 115, 22, 0.18);
      }
      50% {
        box-shadow: 0 0 32px rgba(239, 68, 68, 0.45), 0 0 65px rgba(249, 115, 22, 0.35);
      }
    }

    .animate-card {
      animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .avatar-ring {
      background: linear-gradient(135deg, #ef4444, #f97316, #fb923c);
      padding: 3px;
    }
  </style>
</head>
<body class="bg-[#050507] text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden selection:bg-orange-500 selection:text-black">

  <!-- Background Ambient Glows -->
  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-red-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-orange-600/5 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Profile Card -->
  <div class="animate-card pulse-glow relative max-w-md w-full bg-[#0d0c11]/90 backdrop-blur-md border border-neutral-800/90 rounded-2xl p-8 flex flex-col items-center text-center shadow-2xl transition-all duration-300 hover:border-orange-500/40">

    <!-- Avatar with Red-Orange Gradient Border -->
    <div class="relative mb-4 group">
      <div class="avatar-ring rounded-full shadow-lg transition-transform duration-300 group-hover:scale-105">
        <img id="avatar" class="w-28 h-28 rounded-full bg-[#050507] object-cover" src="" alt="Avatar" />
      </div>
    </div>
    
    <!-- Department Badge -->
    <span id="badge" class="px-3.5 py-1 bg-red-950/50 border border-orange-500/40 text-orange-400 text-xs rounded-full font-semibold tracking-wide mb-3 transition-transform duration-200 hover:scale-105"></span>
    
    <!-- Name and Role -->
    <h1 id="name" class="text-2xl font-extrabold tracking-tight text-white mb-1"></h1>
    <p id="role" class="text-orange-400/90 text-sm font-medium mb-3"></p>
    <p id="bio" class="text-neutral-300 text-sm leading-relaxed mb-6 font-normal"></p>

    <!-- Social Links -->
    <div id="socials" class="flex flex-wrap justify-center gap-3 mb-8 text-sm font-medium">
      <a id="lnk-whatsapp" class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500 hover:text-black transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-emerald-500/20" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="lnk-linkedin" class="px-3 py-1.5 rounded-lg bg-orange-500/10 text-orange-400 border border-orange-500/30 hover:bg-orange-500 hover:text-black transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-orange-500/20" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a id="lnk-github" class="px-3 py-1.5 rounded-lg bg-neutral-900 text-neutral-300 border border-neutral-800 hover:bg-neutral-800 hover:text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a id="lnk-email" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-red-500/20">Email</a>
    </div>

    <!-- Personal QR Code Box -->
    <div class="w-full bg-[#050507]/90 border border-neutral-800/90 rounded-xl p-5 flex flex-col items-center transition-all duration-300 hover:border-orange-500/40">
      <p class="text-[11px] text-neutral-400 mb-3 uppercase tracking-widest font-bold">Scan to View My Profile</p>
      <div id="qrcode" class="p-2.5 bg-white rounded-xl shadow-md transition-transform duration-300 hover:scale-105"></div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="mt-6 text-xs text-neutral-500 hover:text-orange-400 transition-colors duration-200 flex items-center gap-1.5">
      <span>←</span> Back to All Members
    </a>
  </div>

  <!-- Dynamic Script -->
  <script src="members.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id") || "01";
    const data = members[id] || members["01"];

    document.getElementById("name").textContent = data.name;
    document.getElementById("role").textContent = data.role;
    document.getElementById("badge").textContent = `${data.department} • #${String(id).padStart(2, '0')}`;
    document.getElementById("bio").textContent = data.bio;
    document.getElementById("avatar").src = data.avatar;

    document.getElementById("lnk-whatsapp").href = data.whatsapp;
    document.getElementById("lnk-linkedin").href = data.linkedin;
    document.getElementById("lnk-github").href = data.github;
    document.getElementById("lnk-email").href = `mailto:${data.email}`;

    // Generates unique QR linking directly to this profile URL
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 135,
      height: 135
    });
  </script>
</body>
</html>
