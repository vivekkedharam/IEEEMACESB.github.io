<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Portfolio | IEEE MACE SB</title>
    <!-- Combined styles for the profile card -->
    <style>
      :root {
        --bg-color: #010101;
        --card-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --accent: #3498db;
        --glow: rgba(52, 152, 219, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        background-image: url("BG.jpeg"); /* Original background */
        background-size: cover;
        background-position: center;
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .portfolio-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 30px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        position: relative;
        backdrop-filter: blur(5px);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      /* Hover glow effect matching the avatar glow */
      .portfolio-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px var(--glow);
      }

      .top-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .member-name {
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 5px;
        letter-spacing: 1px;
      }

      .member-role {
        font-size: 14px;
        color: var(--accent);
        background: rgba(52, 152, 219, 0.1);
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: 600;
      }

      /* Container for the new rounded photo in the central area */
      .avatar-container {
        margin: 30px auto;
        width: 150px;
        height: 150px;
        position: relative;
      }

      /* The perfectly rounded avatar image with a soft blue glow */
      .member-avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%; /* Makes it circular */
        border: 4px solid var(--accent);
        box-shadow: 0 0 15px var(--glow); /* The visual glow frame */
      }

      .bottom-section {
        margin-top: 15px;
      }

      .bio {
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      .contact-links {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 100%;
      }

      .contact-btn {
        text-decoration: none;
        color: var(--text-primary);
        font-size: 14px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: background 0.2s ease;
      }

      .contact-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- The structure is clean: Top Info -> Rounded Avatar -> Bio -> Buttons -->
    <div class="portfolio-card" id="profileCard">
      <div class="top-section">
        <h1 class="member-name" id="name">MEMBER NAME</h1>
        <p class="member-role" id="role">ROLE / DEPARTMENT</p>
      </div>

      <!-- New visible rounded image area that replaces the QR code -->
      <div class="avatar-container">
        <img src="" alt="Member Photo" class="member-avatar" id="avatarImg" />
      </div>

      <div class="bottom-section">
        <p class="bio" id="bio">ExeCom Member 2026 | Department Name</p>

        <div class="contact-links">
          <a href="#" class="contact-btn" id="linkedin" target="_blank">LinkedIn</a>
          <a href="#" class="contact-btn" id="github" target="_blank">GitHub</a>
          <a href="#" class="contact-btn" id="whatsapp" target="_blank">WhatsApp</a>
          <a href="#" class="contact-btn" id="email" target="_blank">Email</a>
        </div>
      </div>
    </div>

    <!-- Original script logic retained to pull from members.js -->
    <script src="members.js"></script>
    <script>
      function loadProfile() {
        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get("id");

        // Use standard ID like '01', fallback to first member
        const data = members[memberId] || members["01"];

        if (data) {
          document.getElementById("name").textContent = data.name;
          document.getElementById("role").textContent =
            data.role + " | " + data.department;
          document.getElementById("bio").textContent = data.bio;
          document.getElementById("avatarImg").src = data.avatar;

          // Social Links (only set if they exist in members.js)
          if (data.linkedin) document.getElementById("linkedin").href = data.linkedin;
          if (data.github) document.getElementById("github").href = data.github;
          if (data.whatsapp) document.getElementById("whatsapp").href = data.whatsapp;
          if (data.email) document.getElementById("email").href = data.email;
        }
      }

      // Run on page load
      loadProfile();
    </script>
  </body>
</html>
