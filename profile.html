<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Portfolio | IEEE MACE SB</title>
    <style>
      :root {
        --bg-color: #010101;
        --card-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --accent: #3498db;
        --glow: rgba(52, 152, 219, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        background-image: url("BG.jpeg");
        background-size: cover;
        background-position: center;
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px 15px;
      }

      .portfolio-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 28px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        position: relative;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .top-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .member-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .member-role {
        font-size: 13px;
        color: var(--accent);
        background: rgba(52, 152, 219, 0.15);
        padding: 5px 14px;
        border-radius: 20px;
        font-weight: 600;
      }

      /* Circular Avatar */
      .avatar-wrapper {
        margin: 20px auto 10px;
        position: relative;
        width: 160px;
        height: 160px;
      }

      .avatar-frame {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 4px solid var(--accent);
        box-shadow: 0 0 20px var(--glow);
        overflow: hidden;
        position: relative;
        background: #111;
        user-select: none;
        touch-action: none;
      }

      .avatar-frame.admin-mode {
        cursor: grab;
      }

      .avatar-frame.admin-mode:active {
        cursor: grabbing;
      }

      .avatar-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
        pointer-events: none;
      }

      /* Admin Control Drawer: hidden from regular visitors */
      .admin-panel {
        display: none;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 14px;
        margin: 15px 0;
        text-align: left;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .control-row input[type="range"] {
        flex: 1;
        margin: 0 10px;
        accent-color: var(--accent);
      }

      .btn-save {
        width: 100%;
        background: #27ae60;
        color: #fff;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s ease;
      }

      .btn-save:hover {
        background: #2ecc71;
      }

      .status-text {
        font-size: 11px;
        text-align: center;
        margin-top: 6px;
        color: #2ecc71;
      }

      .bio {
        color: var(--text-secondary);
        font-size: 13.5px;
        line-height: 1.5;
        margin: 14px 0 20px;
      }

      .contact-links {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .contact-btn {
        text-decoration: none;
        color: var(--text-primary);
        font-size: 13px;
        padding: 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.2s ease;
      }

      .contact-btn:hover {
        background: rgba(52, 152, 219, 0.25);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="portfolio-card">
      <div class="top-section">
        <h1 class="member-name" id="name">MEMBER NAME</h1>
        <p class="member-role" id="role">ROLE / DEPARTMENT</p>
      </div>

      <div class="avatar-wrapper">
        <div class="avatar-frame" id="avatarFrame">
          <img src="" alt="Profile Avatar" id="avatarImg" />
        </div>
      </div>

      <!-- Admin Editor Tools -->
      <div class="admin-panel" id="adminPanel">
        <div class="control-row">
          <span>Zoom:</span>
          <input type="range" id="zoomRange" min="1" max="3" step="0.05" value="1" />
          <span id="zoomVal">1.0x</span>
        </div>
        <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 8px;">
          👉 Drag the photo directly inside the circle to position it.
        </p>
        <button class="btn-save" id="saveBtn">Save Alignment</button>
        <div class="status-text" id="statusMsg"></div>
      </div>

      <p class="bio" id="bio"></p>

      <div class="contact-links">
        <a href="#" class="contact-btn" id="linkedin" target="_blank">LinkedIn</a>
        <a href="#" class="contact-btn" id="github" target="_blank">GitHub</a>
        <a href="#" class="contact-btn" id="whatsapp" target="_blank">WhatsApp</a>
        <a href="#" class="contact-btn" id="email" target="_blank">Email</a>
      </div>
    </div>

    <script src="members.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get("id") || "01";
      const isAdmin = urlParams.get("admin") === "true";
      const data = (typeof members !== "undefined" && members[memberId]) ? members[memberId] : (typeof members !== "undefined" ? members["01"] : null);

      const avatarImg = document.getElementById("avatarImg");
      const frame = document.getElementById("avatarFrame");
      const statusMsg = document.getElementById("statusMsg");

      let posX = (data && data.posX !== undefined) ? data.posX : 0;
      let posY = (data && data.posY !== undefined) ? data.posY : 0;
      let scale = (data && data.zoom !== undefined) ? data.zoom : 1;

      // Check saved alignment from browser storage
      const localSaved = localStorage.getItem("member_align_" + memberId);
      if (localSaved) {
        try {
          const parsed = JSON.parse(localSaved);
          posX = parsed.posX;
          posY = parsed.posY;
          scale = parsed.scale;
        } catch (e) {}
      }

      function applyTransform() {
        avatarImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      }

      if (data) {
        document.getElementById("name").textContent = data.name;
        document.getElementById("role").textContent = data.role + " | " + data.department;
        document.getElementById("bio").textContent = data.bio;
        avatarImg.src = data.avatar;
        applyTransform();

        if (data.linkedin) document.getElementById("linkedin").href = data.linkedin;
        if (data.github) document.getElementById("github").href = data.github;
        if (data.whatsapp) document.getElementById("whatsapp").href = data.whatsapp;
        if (data.email) document.getElementById("email").href = data.email;
      }

      // Admin mode: only activated if URL has &admin=true
      if (isAdmin) {
        document.getElementById("adminPanel").style.display = "block";
        frame.classList.add("admin-mode");

        const zoomRange = document.getElementById("zoomRange");
        const zoomVal = document.getElementById("zoomVal");
        zoomRange.value = scale;
        zoomVal.textContent = scale.toFixed(1) + "x";

        zoomRange.addEventListener("input", (e) => {
          scale = parseFloat(e.target.value);
          zoomVal.textContent = scale.toFixed(1) + "x";
          applyTransform();
        });

        let isDragging = false, startX, startY;
        const onStart = (e) => {
          isDragging = true;
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          startX = cx - posX;
          startY = cy - posY;
        };

        const onMove = (e) => {
          if (!isDragging) return;
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          posX = Math.round(cx - startX);
          posY = Math.round(cy - startY);
          applyTransform();
        };

        const onEnd = () => { isDragging = false; };

        frame.addEventListener("mousedown", onStart);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);
        frame.addEventListener("touchstart", onStart, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd);

        // Save position permanently on device
        document.getElementById("saveBtn").addEventListener("click", () => {
          localStorage.setItem(
            "member_align_" + memberId,
            JSON.stringify({ posX, posY, scale })
          );
          statusMsg.textContent = "✓ Alignment saved! Stays active across refreshes.";
          setTimeout(() => { statusMsg.textContent = ""; }, 3000);
        });
      }
    </script>
  </body>
</html>
