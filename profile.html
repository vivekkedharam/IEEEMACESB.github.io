<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.25), 0 0 35px rgba(59, 130, 246, 0.15);
      }
      50% {
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.45), 0 0 55px rgba(59, 130, 246, 0.3);
      }
    }

    @keyframes avatarSpinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-card {
      animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .avatar-ring {
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #10b981);
      padding: 3px;
    }
  </style>
</head>
<body class="bg-[#0b0f17] text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden selection:bg-cyan-500 selection:text-black">

  <!-- Background decorative light blur -->
  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Profile Card -->
  <div class="animate-card pulse-glow relative max-w-md w-full bg-[#131b2e]/90 backdrop-blur-md border border-slate-800/80 rounded-2xl p-8 flex flex-col items-center text-center shadow-2xl transition-all duration-300 hover:border-slate-700">

    <!-- Avatar with rotating gradient border -->
    <div class="relative mb-4 group">
      <div class="avatar-ring rounded-full shadow-lg transition-transform duration-300 group-hover:scale-105">
        <img id="avatar" class="w-28 h-28 rounded-full bg-[#0b0f17] object-cover" src="" alt="Avatar" />
      </div>
    </div>
    
    <!-- Badges & Information -->
    <span id="badge" class="px-3.5 py-1 bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 text-xs rounded-full font-semibold tracking-wide mb-3 transition-transform duration-200 hover:scale-105"></span>
    <h1 id="name" class="text-2xl font-extrabold tracking-tight text-white mb-1"></h1>
    <p id="role" class="text-cyan-400/80 text-sm font-medium mb-3"></p>
    <p id="bio" class="text-slate-300 text-sm leading-relaxed mb-6 font-normal"></p>

    <!-- Social Links -->
    <div id="socials" class="flex flex-wrap justify-center gap-3 mb-8 text-sm font-medium">
      <a id="lnk-whatsapp" class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500 hover:text-black transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-emerald-500/20" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="lnk-linkedin" class="px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500 hover:text-black transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-cyan-500/20" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a id="lnk-github" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a id="lnk-email" class="px-3 py-1.5 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500 hover:text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-blue-500/20">Email</a>
    </div>

    <!-- Personal QR Code Box -->
    <div class="w-full bg-[#0b0f17]/90 border border-slate-800/80 rounded-xl p-5 flex flex-col items-center transition-all duration-300 hover:border-cyan-500/30">
      <p class="text-[11px] text-slate-400 mb-3 uppercase tracking-widest font-bold">Scan to View My Profile</p>
      <div id="qrcode" class="p-2.5 bg-white rounded-xl shadow-md transition-transform duration-300 hover:scale-105"></div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="mt-6 text-xs text-slate-500 hover:text-cyan-400 transition-colors duration-200 flex items-center gap-1.5">
      <span>←</span> Back to All Members
    </a>
  </div>

  <!-- Dynamic Script -->
  <script src="members.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id") || "01";
    const data = members[id] || members["01"];

    document.getElementById("name").textContent = data.name;
    document.getElementById("role").textContent = data.role;
    document.getElementById("badge").textContent = `${data.department} • #${String(id).padStart(2, '0')}`;
    document.getElementById("bio").textContent = data.bio;
    document.getElementById("avatar").src = data.avatar;

    document.getElementById("lnk-whatsapp").href = data.whatsapp;
    document.getElementById("lnk-linkedin").href = data.linkedin;
    document.getElementById("lnk-github").href = data.github;
    document.getElementById("lnk-email").href = `mailto:${data.email}`;

    // Generates unique QR linking directly to this profile URL
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 135,
      height: 135
    });
  </script>
</body>
</html>
